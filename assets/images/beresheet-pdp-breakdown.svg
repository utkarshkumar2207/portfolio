<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="100%" height="100%">
  <defs>
    <linearGradient id="teal-grad-pdp" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0F766E"/>
      <stop offset="100%" stop-color="#14B8A6"/>
    </linearGradient>
  </defs>

  <rect width="900" height="480" fill="#F8FAFC"/>

  <!-- Left: Standard PDP Flow (Customer Drop-off Zone) -->
  <g transform="translate(40, 30)">
    <rect width="380" height="420" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
    <rect width="380" height="38" rx="8" fill="#F1F5F9"/>
    <path d="M 0 38 L 380 38" stroke="#E2E8F0" stroke-width="1"/>
    
    <text x="20" y="24" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#64748B">CONVENTIONAL PDP JOURNEY</text>

    <!-- Wireframe Blocks -->
    <rect x="20" y="55" width="160" height="120" rx="4" fill="#F1F5F9"/>
    <text x="100" y="118" font-family="'Inter', sans-serif" font-size="10" fill="#94A3B8" text-anchor="middle">Product Images</text>

    <rect x="195" y="55" width="165" height="18" rx="3" fill="#E2E8F0"/>
    <rect x="195" y="80" width="80" height="14" rx="3" fill="#0F766E" fill-opacity="0.2"/>
    <rect x="195" y="105" width="165" height="40" rx="3" fill="#F8FAFC" stroke="#E2E8F0"/>
    <rect x="195" y="155" width="165" height="24" rx="3" fill="#0F172A"/>

    <!-- Friction Callout -->
    <rect x="20" y="195" width="340" height="100" rx="6" fill="#FFF1F2" stroke="#FECDD3" stroke-width="1"/>
    <text x="36" y="222" font-family="'Inter', sans-serif" font-weight="700" font-size="12" fill="#BE123C">The Customer Hesitation Point:</text>
    <text x="36" y="244" font-family="'Inter', sans-serif" font-size="11" fill="#9F1239">"Will Dead Sea mud actually improve my skin?"</text>
    <text x="36" y="264" font-family="'Inter', sans-serif" font-size="11" fill="#9F1239">• Skepticism regarding vague mineral claims.</text>
    <text x="36" y="280" font-family="'Inter', sans-serif" font-size="11" fill="#9F1239">• Wall of generic text resulted in shopper abandonment.</text>

    <rect x="20" y="315" width="340" height="85" rx="4" fill="#F1F5F9" stroke="#E2E8F0"/>
    <text x="190" y="360" font-family="'Inter', sans-serif" font-size="11" fill="#94A3B8" text-anchor="middle">Reviews / Shipping FAQ (Below the fold)</text>
  </g>

  <!-- Right: Optimized PDP with "Visible Results You Can See" -->
  <g transform="translate(480, 30)">
    <rect width="380" height="420" rx="8" fill="#FFFFFF" stroke="#0F766E" stroke-width="2"/>
    <rect width="380" height="38" rx="8" fill="#F0FDFA"/>
    <path d="M 0 38 L 380 38" stroke="#CCFBF1" stroke-width="1"/>

    <text x="20" y="24" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#0F766E">OPTIMIZED VALUE-PROOF PDP</text>

    <!-- Top fold -->
    <rect x="20" y="55" width="160" height="100" rx="4" fill="#F1F5F9"/>
    <rect x="195" y="55" width="165" height="16" rx="3" fill="#E2E8F0"/>
    <rect x="195" y="78" width="80" height="14" rx="3" fill="#CCFBF1"/>
    <rect x="195" y="100" width="165" height="24" rx="3" fill="#0F766E"/>
    <text x="277" y="116" font-family="'Inter', sans-serif" font-size="10" font-weight="600" fill="#FFFFFF" text-anchor="middle">ADD TO BAG</text>

    <!-- The Injected Proof Architecture -->
    <rect x="20" y="170" width="340" height="140" rx="6" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.5"/>
    <rect x="32" y="182" width="140" height="18" rx="3" fill="#CCFBF1"/>
    <text x="36" y="195" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="700" fill="#0F766E">NEW PROOF SECTION</text>

    <text x="32" y="220" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="13" fill="#0F172A">Visible Results You Can See</text>
    <text x="32" y="236" font-family="'Inter', sans-serif" font-size="10" fill="#475569">3 comparative benefit cards addressing clinical efficacy:</text>

    <!-- Micro Cards -->
    <rect x="32" y="248" width="98" height="50" rx="3" fill="#FFFFFF" stroke="#CCFBF1"/>
    <text x="81" y="268" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="8.5" fill="#0F766E" text-anchor="middle">Hydration</text>
    <text x="81" y="282" font-family="'Inter', sans-serif" font-size="7.5" fill="#64748B" text-anchor="middle">Deep Mineral Lock</text>

    <rect x="140" y="248" width="98" height="50" rx="3" fill="#FFFFFF" stroke="#CCFBF1"/>
    <text x="189" y="268" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="8.5" fill="#0F766E" text-anchor="middle">Smoothing</text>
    <text x="189" y="282" font-family="'Inter', sans-serif" font-size="7.5" fill="#64748B" text-anchor="middle">Salt Micro-Crystals</text>

    <rect x="248" y="248" width="98" height="50" rx="3" fill="#FFFFFF" stroke="#CCFBF1"/>
    <text x="297" y="268" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="8.5" fill="#0F766E" text-anchor="middle">Redness</text>
    <text x="297" y="282" font-family="'Inter', sans-serif" font-size="7.5" fill="#64748B" text-anchor="middle">Clinical Relief</text>

    <!-- Validated Impact -->
    <rect x="20" y="325" width="340" height="75" rx="6" fill="#ECFDF5" stroke="#10B981" stroke-width="1"/>
    <text x="36" y="348" font-family="'Inter', sans-serif" font-weight="700" font-size="11" fill="#065F46">Validated Business Outcome:</text>
    <text x="36" y="368" font-family="'Inter', sans-serif" font-size="10.5" fill="#047857">• Directly improved shopper confidence and product understanding.</text>
    <text x="36" y="385" font-family="'Inter', sans-serif" font-size="10.5" fill="#047857">• Stakeholders reported a direct sales increase following deployment.</text>
  </g>
</svg>
