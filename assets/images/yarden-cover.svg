<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad-yarden" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#12161F"/>
      <stop offset="100%" stop-color="#090C10"/>
    </linearGradient>
    <pattern id="grid-yarden" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    </pattern>
    <linearGradient id="gold-accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D4AF37"/>
      <stop offset="50%" stop-color="#FFF2A3"/>
      <stop offset="100%" stop-color="#AA820A"/>
    </linearGradient>
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1C222E"/>
      <stop offset="100%" stop-color="#141822"/>
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="500" fill="url(#bg-grad-yarden)"/>
  <rect width="800" height="500" fill="url(#grid-yarden)"/>

  <!-- Browser Chrome Mockup Container -->
  <g transform="translate(40, 36)">
    <!-- Browser Window Frame -->
    <rect width="720" height="428" rx="8" fill="#161B24" stroke="#2B3242" stroke-width="1.5"/>
    
    <!-- Window Header -->
    <rect width="720" height="38" rx="8" fill="#1C222E"/>
    <path d="M 0 38 L 720 38" stroke="#2B3242" stroke-width="1"/>
    
    <!-- Window Controls -->
    <circle cx="22" cy="19" r="5" fill="#EF4444"/>
    <circle cx="38" cy="19" r="5" fill="#F59E0B"/>
    <circle cx="54" cy="19" r="5" fill="#10B981"/>

    <!-- URL Bar -->
    <rect x="180" y="8" width="360" height="22" rx="4" fill="#0E1218" stroke="#2A3140" stroke-width="1"/>
    <text x="360" y="23" font-family="'JetBrains Mono', monospace" font-size="11" fill="#717D96" text-anchor="middle">yardenjewelry.com • visual realignment draft</text>

    <!-- Content Area: Hero Mockup UI -->
    <!-- Nav Mockup -->
    <text x="32" y="72" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="16" fill="#FFFFFF" letter-spacing="2">YARDEN</text>
    <text x="140" y="70" font-family="'Inter', sans-serif" font-size="11" fill="#94A3B8">COLLECTIONS</text>
    <text x="240" y="70" font-family="'Inter', sans-serif" font-size="11" fill="#94A3B8">BOLD CHAINS</text>
    <text x="340" y="70" font-family="'Inter', sans-serif" font-size="11" fill="#94A3B8">HIP-HOP ICED</text>
    <rect x="620" y="58" width="68" height="24" rx="4" fill="#D4AF37"/>
    <text x="654" y="74" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#000000" text-anchor="middle">CART (0)</text>

    <!-- Hero Content Layout -->
    <rect x="32" y="104" width="340" height="280" rx="6" fill="url(#card-grad)" stroke="#2D3546" stroke-width="1"/>
    <rect x="52" y="126" width="120" height="18" rx="3" fill="#D4AF37" fill-opacity="0.15"/>
    <text x="58" y="139" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" fill="#D4AF37">NEW DIRECTION // 2024</text>
    
    <text x="52" y="180" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="28" fill="#FFFFFF" line-height="1.1">BOLD SHINE.</text>
    <text x="52" y="212" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="28" fill="url(#gold-accent)">RAW ATTITUDE.</text>
    
    <text x="52" y="244" font-family="'Inter', sans-serif" font-size="11" fill="#94A3B8">Realigned high-contrast dark luxury brand presentation.</text>
    <text x="52" y="260" font-family="'Inter', sans-serif" font-size="11" fill="#94A3B8">Crafted for American hip-hop jewelry enthusiasts.</text>

    <rect x="52" y="286" width="130" height="34" rx="4" fill="url(#gold-accent)"/>
    <text x="117" y="308" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#000000" text-anchor="middle">EXPLORE PIECES</text>

    <!-- Visual Showcase Frame (Right Side) -->
    <rect x="390" y="104" width="298" height="280" rx="6" fill="#0F131A" stroke="#2D3546" stroke-width="1"/>
    
    <!-- Stylized Jewelry Chain Graphic -->
    <circle cx="539" cy="220" r="85" fill="none" stroke="url(#gold-accent)" stroke-width="14" stroke-dasharray="16 10"/>
    <circle cx="539" cy="220" r="50" fill="none" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="2"/>
    <text x="539" y="215" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="14" fill="#FFFFFF" text-anchor="middle">ICED CUBAN LINK</text>
    <text x="539" y="235" font-family="'JetBrains Mono', monospace" font-size="12" fill="#D4AF37" text-anchor="middle">$380 USD</text>

    <!-- Design System Annotations Badge -->
    <rect x="410" y="340" width="258" height="26" rx="4" fill="#1A212E" stroke="#374151" stroke-width="1"/>
    <circle cx="424" cy="353" r="4" fill="#10B981"/>
    <text x="436" y="357" font-family="'JetBrains Mono', monospace" font-size="10" fill="#E2E8F0">Client Approved • +$100 Scope</text>
  </g>

  <!-- Watermark Flag -->
  <rect x="580" y="445" width="180" height="22" rx="4" fill="#1E293B" stroke="#334155" stroke-width="1"/>
  <text x="670" y="460" font-family="'JetBrains Mono', monospace" font-size="9" fill="#94A3B8" text-anchor="middle">AUTHENTIC CASE STUDY DRAFT</text>
</svg>
