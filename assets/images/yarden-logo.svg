<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350" width="100%" height="100%">
  <!-- Background with warm jewelry brand tone -->
  <rect width="600" height="350" fill="#FBF8F3"/>
  
  <!-- Subtle border framing -->
  <rect x="24" y="24" width="552" height="302" rx="12" fill="#FFFFFF" stroke="#EDE4D8" stroke-width="1.5"/>

  <!-- Logo Group -->
  <g transform="translate(300, 160)" text-anchor="middle">
    <!-- Brand Typography - Approved Serif Wordmark -->
    <text y="15" font-family="'Newsreader', 'Playfair Display', Georgia, serif" font-weight="600" font-size="46" fill="#280B0F" letter-spacing="8">YARDEN</text>
    <text y="48" font-family="'JetBrains Mono', monospace" font-weight="600" font-size="9" fill="#8D3A3C" letter-spacing="4">FINE JEWELRY</text>
  </g>
</svg>