<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad-foldy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#EDF2F7"/>
    </linearGradient>
    <pattern id="grid-foldy" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="rgba(100,116,139,0.06)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="500" fill="url(#bg-grad-foldy)"/>
  <rect width="800" height="500" fill="url(#grid-foldy)"/>

  <!-- Browser Chrome Mockup Container -->
  <g transform="translate(40, 36)">
    <!-- Browser Window Frame -->
    <rect width="720" height="428" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    
    <!-- Window Header -->
    <rect width="720" height="38" rx="8" fill="#F1F5F9"/>
    <path d="M 0 38 L 720 38" stroke="#E2E8F0" stroke-width="1"/>
    
    <!-- Window Controls -->
    <circle cx="22" cy="19" r="5" fill="#EF4444"/>
    <circle cx="38" cy="19" r="5" fill="#F59E0B"/>
    <circle cx="54" cy="19" r="5" fill="#10B981"/>

    <!-- URL Bar -->
    <rect x="180" y="8" width="360" height="22" rx="4" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
    <text x="360" y="23" font-family="'JetBrains Mono', monospace" font-size="11" fill="#64748B" text-anchor="middle">foldymat.com • modular e-commerce case study shell</text>

    <!-- Content Area: Wireframe & Staging Layout -->
    <rect x="32" y="60" width="656" height="340" rx="6" fill="#F8FAFC" stroke="#E2E8F0" stroke-dasharray="6 4" stroke-width="1.5"/>

    <!-- Staging Badge -->
    <rect x="230" y="110" width="260" height="28" rx="14" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1"/>
    <circle cx="246" cy="124" r="4" fill="#2563EB"/>
    <text x="260" y="128" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="#1D4ED8">MODULAR STRUCTURE STAGED</text>

    <!-- Title & Wireframe Presentation -->
    <text x="360" y="175" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="24" fill="#0F172A" text-anchor="middle">Foldy Mat — Product Differentiation</text>
    <text x="360" y="202" font-family="'Inter', sans-serif" font-size="13" fill="#64748B" text-anchor="middle">Awaiting final project contributions, authentic product imagery, and client sign-off.</text>

    <!-- Stylized Foldable Geometry Diagram -->
    <g transform="translate(180, 230)">
      <!-- Panel 1 -->
      <polygon points="0,50 60,30 60,80 0,100" fill="#3B82F6" fill-opacity="0.2" stroke="#2563EB" stroke-width="1.5"/>
      <!-- Panel 2 -->
      <polygon points="60,30 140,40 140,90 60,80" fill="#3B82F6" fill-opacity="0.35" stroke="#2563EB" stroke-width="1.5"/>
      <!-- Panel 3 -->
      <polygon points="140,40 220,20 220,70 140,90" fill="#3B82F6" fill-opacity="0.5" stroke="#2563EB" stroke-width="1.5"/>
      <!-- Panel 4 -->
      <polygon points="220,20 300,35 300,85 220,70" fill="#3B82F6" fill-opacity="0.65" stroke="#2563EB" stroke-width="1.5"/>
      <!-- Panel 5 (Folded Layer) -->
      <polygon points="300,35 360,15 360,65 300,85" fill="#1D4ED8" stroke="#1E40AF" stroke-width="1.5"/>
    </g>

    <text x="360" y="360" font-family="'JetBrains Mono', monospace" font-size="11" fill="#94A3B8" text-anchor="middle">Ready for authentic screens • No synthetic or fabricated details</text>
  </g>

  <!-- Watermark Flag -->
  <rect x="580" y="445" width="180" height="22" rx="4" fill="#E2E8F0" stroke="#CBD5E1" stroke-width="1"/>
  <text x="670" y="460" font-family="'JetBrains Mono', monospace" font-size="9" fill="#475569" text-anchor="middle">AUTHENTIC CASE STUDY DRAFT</text>
</svg>
