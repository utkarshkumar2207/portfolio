<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="100%" height="100%">
  <defs>
    <linearGradient id="gold-grad-ba" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#F3E5AB"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="900" height="480" fill="#F8FAFC"/>

  <!-- Left Side: Previous Stalled Direction -->
  <g transform="translate(30, 30)">
    <rect width="400" height="420" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
    <rect width="400" height="40" rx="8" fill="#F1F5F9"/>
    <path d="M 0 40 L 400 40" stroke="#E2E8F0" stroke-width="1"/>
    
    <rect x="16" y="10" width="80" height="20" rx="4" fill="#FEE2E2"/>
    <text x="24" y="24" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#991B1B">BEFORE</text>
    <text x="110" y="24" font-family="'Inter', sans-serif" font-size="11" fill="#64748B">Previous Direction (Client Rejected)</text>

    <!-- Generic Low-Contrast Template -->
    <text x="24" y="80" font-family="'Inter', sans-serif" font-size="14" fill="#64748B">Yarden Jewelry Store</text>
    <rect x="24" y="105" width="352" height="150" rx="4" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
    <text x="200" y="165" font-family="'Inter', sans-serif" font-size="12" fill="#94A3B8" text-anchor="middle">Generic Light Theme Template</text>
    <text x="200" y="185" font-family="'Inter', sans-serif" font-size="11" fill="#CBD5E1" text-anchor="middle">(Lacked hip-hop attitude &amp; premium contrast)</text>

    <!-- Feedback flags -->
    <rect x="24" y="275" width="352" height="120" rx="6" fill="#FFF1F2" stroke="#FECDD3" stroke-width="1"/>
    <text x="40" y="302" font-family="'Inter', sans-serif" font-weight="700" font-size="12" fill="#BE123C">Client Dissatisfaction Drivers:</text>
    <text x="40" y="325" font-family="'Inter', sans-serif" font-size="11" fill="#9F1239">• Generic white aesthetic did not reflect urban hip-hop culture.</text>
    <text x="40" y="345" font-family="'Inter', sans-serif" font-size="11" fill="#9F1239">• Jewelry appeared flat and lacked metallic brilliance.</text>
    <text x="40" y="365" font-family="'Inter', sans-serif" font-size="11" fill="#9F1239">• Client felt misunderstood by the initial delivery team.</text>
  </g>

  <!-- Right Side: Proposed Realigned Direction -->
  <g transform="translate(470, 30)">
    <rect width="400" height="420" rx="8" fill="#0F1217" stroke="#2D3546" stroke-width="1.5"/>
    <rect width="400" height="40" rx="8" fill="#171C24"/>
    <path d="M 0 40 L 400 40" stroke="#2D3546" stroke-width="1"/>

    <rect x="16" y="10" width="70" height="20" rx="4" fill="#ECFDF5"/>
    <text x="24" y="24" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#065F46">AFTER</text>
    <text x="96" y="24" font-family="'Inter', sans-serif" font-size="11" fill="#94A3B8">Realigned Direction (Client Approved)</text>

    <!-- Bold High-Contrast Hip-Hop Direction -->
    <text x="24" y="80" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="15" fill="#FFFFFF" letter-spacing="2">YARDEN JEWELRY</text>
    
    <rect x="24" y="105" width="352" height="150" rx="4" fill="#1A212E" stroke="#374151" stroke-width="1"/>
    <text x="40" y="145" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="18" fill="#FFFFFF">BOLD SHINE. RAW ATTITUDE.</text>
    <text x="40" y="168" font-family="'Inter', sans-serif" font-size="11" fill="#94A3B8">High-contrast obsidian canvas with reflective gold accents.</text>
    
    <rect x="40" y="185" width="100" height="26" rx="4" fill="url(#gold-grad-ba)"/>
    <text x="90" y="202" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#000000" text-anchor="middle">SHOP ICED PIECES</text>

    <!-- Outcome flags -->
    <rect x="24" y="275" width="352" height="120" rx="6" fill="#064E3B" fill-opacity="0.3" stroke="#059669" stroke-width="1"/>
    <text x="40" y="302" font-family="'Inter', sans-serif" font-weight="700" font-size="12" fill="#34D399">Verified Redesign Results:</text>
    <text x="40" y="325" font-family="'Inter', sans-serif" font-size="11" fill="#A7F3D0">• Client immediately approved proposed aesthetic shift.</text>
    <text x="40" y="345" font-family="'Inter', sans-serif" font-size="11" fill="#A7F3D0">• Agreed to pay +$100 additional budget to implement.</text>
    <text x="40" y="365" font-family="'Inter', sans-serif" font-size="11" fill="#A7F3D0">• Restored client confidence and engineering velocity.</text>
  </g>
</svg>
